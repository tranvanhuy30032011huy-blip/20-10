<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #d81b60;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.6);
        }

        /* Khung lời chúc */
        .wishes-card {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fff0f5;
            border-left: 5px solid #ff4081;
            border-radius: 10px;
            animation: slideDown 0.5s ease;
        }

        .wishes-card p {
            color: #ad1457;
            font-style: italic;
            margin-bottom: 0;
        }

        /* Hiệu ứng bong bóng / hoa rơi */
        .falling-item {
            position: absolute;
            top: -10%;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Women's Day 🌸</h1>
        <p>Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và hạnh phúc bên những người thân yêu!</p>
        
        <button class="btn" onclick="showWish()">Nhận lời chúc ngọt ngào ❤️</button>

        <div class="wishes-card" id="wishesCard">
            <p id="wishText">"Chúc bạn luôn tỏa sáng như những bông hoa ngát hương!"</p>
        </div>
    </div>

    <script>
        // Danh sách lời chúc ngẫu nhiên
        const wishes = [
            "Chúc bạn luôn tỏa sáng như những bông hoa ngát hương, công việc thuận lợi và luôn nở nụ cười trên môi!",
            "Chúc bạn ngày 20/10 tràn ngập niềm vui, xinh đẹp hơn mỗi ngày và nhận được thật nhiều quà!",
            "Mong rằng mỗi ngày của bạn đều tràn ngập tình yêu thương, hạnh phúc và thành công!",
            "Cảm ơn vì đã luôn tuyệt vời và mang lại năng lượng tích cực cho mọi người xung quanh. Happy 20/10!",
            "Chúc bạn luôn giữ vững tinh thần trẻ trung, yêu đời và đạt được mọi ước mơ của mình!"
        ];

        // Hiển thị lời chúc khi bấm nút
        function showWish() {
            const card = document.getElementById('wishesCard');
            const text = document.getElementById('wishText');
            
            const randomIndex = Math.floor(Math.random() * wishes.length);
            text.innerText = `"${wishes[randomIndex]}"`;
            
            card.style.display = 'block';
        }

        // Hiệu ứng hoa và tim rơi ngẫu nhiên
        function createFallingItems() {
            const items = ['🌸', '🌷', '💖', '💐', '✨', '🌹'];
            const container = document.body;

            setInterval(() => {
                const item = document.createElement('div');
                item.classList.add('falling-item');
                
                item.innerText = items[Math.floor(Math.random() * items.length)];
                item.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 4 + 3;
                item.style.animationDuration = duration + 's';
                item.style.fontSize = (Math.random() * 15 + 15) + 'px';

                container.appendChild(item);

                setTimeout(() => {
                    item.remove();
                }, duration * 1000);
            }, 300);
        }

        // Tự động chạy hiệu ứng khi tải trang
        window.onload = createFallingItems;
    </script>
</body>
</html>
